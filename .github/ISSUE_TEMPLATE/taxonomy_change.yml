name: Propose a taxonomy change
description: Add a topic, add an area, or change how the vocabulary is organized
title: "[Taxonomy]: "
labels: ["taxonomy"]
body:
  - type: markdown
    attributes:
      value: |
        The vocabulary is meant to grow. Adding a **topic** is expected and needs no argument. Adding an **area** changes the structure and requires one. The criteria are in [TAXONOMY.md](https://github.com/juliodosreis/awesome-agenticsystems/blob/main/TAXONOMY.md#changing-the-taxonomy).

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change
      options:
        - Add a topic
        - Add a facet value (about / scale / type / infra / domain)
        - Add an area
        - Rename or remove something
        - Restructure (layers, how facets are cut)
    validations:
      required: true

  - type: input
    id: term
    attributes:
      label: The term
      description: The exact value as it would be written in a `.yml` file. Lowercase, hyphenated.
      placeholder: tool-retrieval
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Why it is needed
      description: >-
        A topic is tested by whether it serves as a filter **today**. A term
        that does not separate the papers already in the collection adds no
        filter. Name the existing papers that would carry it, and the ones
        that would not.
      placeholder: |
        Would apply to: toolformer-2023, react-2022.
        Would not apply to: metagpt-2023, agentbench-2023.
        Today those first two are only reachable through `tool-use`, which
        also covers papers about invoking a known tool.
    validations:
      required: true

  - type: textarea
    id: literature
    attributes:
      label: Support from the literature
      description: >-
        Required for a new area or a restructure, optional for a topic. The
        axes of the taxonomy come from cited work so that they can be argued
        with. The bibliography is in TAXONOMY.md.
    validations:
      required: false

  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: I checked [/taxonomy](https://juliodosreis.com/awesome-agenticsystems/taxonomy) and the term is not already there under another name.
          required: true
