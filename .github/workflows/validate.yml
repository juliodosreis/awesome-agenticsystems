name: Validate

# `npm run build` used to run only on push to main: a pull request breaking the
# schema or the taxonomy was discovered after the merge, with the deploy
# already broken.
#
# On a pull request opened by issue_ops.yml, this workflow is triggered but
# held at "awaiting approval" until a maintainer approves it (observed on
# 2026-10-13). issue_ops therefore runs the same build and tests before it
# opens the pull request, and approving this run is optional.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and record validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs `astro check` plus the build: types, the Zod schema
      # of every record, taxonomy.yml integrity (assertGroupsResolve), id vs
      # filename, and that relates_to / evaluated_on resolve to real papers.
      - name: Build
        run: npm run build

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Node is needed by the tests too: tests/test_schema.py runs a real
      # `npm run build` per case to prove the schema guards actually reject bad
      # records, rather than only proving good ones pass.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm ci

      # The generated blocks of README.md and badges.json are kept in sync on
      # main by docs_sync.yml, and an intake pull request does not carry them.
      # Regenerating here keeps the drift test from failing on such a pull
      # request when a reviewer pushes a fix to it.
      - name: Regenerate docs
        run: python scripts/gen_docs.py

      # Covers the issue parser (including the arXiv fallback, deduplication
      # and vocabulary validation), the doc generator and its drift check, and
      # the build-time guards. The whole suite is ~20s, almost all of it the
      # real builds in test_schema.py.
      - name: Run tests
        run: npm test
