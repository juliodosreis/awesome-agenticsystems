tldr: "An embodied agent that continuously explores a 3D environment by writing, refining, and retrieving executable code from a procedural skill library."
notes: "Pioneers procedural memory by storing acquired skills as executable code (JavaScript) rather than textual descriptions. The automatic curriculum acts as an open-ended exploration mechanism, allowing the agent to continuously expand its capabilities without human intervention."
