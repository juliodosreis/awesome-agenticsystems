name: Process Issue Submission

on:
  issues:
    # `reopened` so that fixing a rejected issue is just close-and-reopen,
    # instead of filing a new one. That is what the error comment tells them.
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write
  # To report the result back to whoever opened the issue. Without this, a
  # validation error dies in the Action logs, which the contributor does not
  # know how (and may not be allowed) to open.
  issues: write

jobs:
  # One job for both forms. The label set by the issue template picks the
  # parser: `paper` for Add a Paper, `resource` for Add a Resource.
  intake:
    if: >-
      contains(github.event.issue.labels.*.name, 'paper') ||
      contains(github.event.issue.labels.*.name, 'resource')
    runs-on: ubuntu-latest
    env:
      KIND: ${{ contains(github.event.issue.labels.*.name, 'paper') && 'paper' || 'resource' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm ci

      - name: Save Issue Body
        env:
          BODY: ${{ github.event.issue.body }}
        run: echo "$BODY" > issue_body.md

      # These three steps are the gate: nothing reaches a pull request without
      # passing the parser, a real Astro build, and the test suite.
      - name: Process Issue
        id: process
        run: |
          set -o pipefail
          if [ "$KIND" = paper ]; then script=process_issue.py; else script=process_resource_issue.py; fi
          python "scripts/$script" issue_body.md 2>&1 | tee process.log

      # A new paper changes the generated list in README.md and the badge
      # count, and the test suite fails when those are stale. They are
      # regenerated here so that the tests run against the new record, and
      # left out of the pull request (see add-paths below): every open intake
      # pull request would otherwise edit the same block, and each merge would
      # put the others in conflict. docs_sync.yml regenerates them on main
      # after the merge.
      - name: Regenerate docs
        run: python scripts/gen_docs.py

      # `npm run build` is the only proof that the generated record compiles.
      # It runs HERE rather than in an `on: pull_request` workflow because pull
      # requests opened with GITHUB_TOKEN do not trigger other workflows: if we
      # waited for the PR, it would never be validated at all.
      - name: Validate build
        id: validate
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      # The test suite has to run HERE for the same reason the build does: a
      # pull request opened with GITHUB_TOKEN does not trigger `on:
      # pull_request`, so validate.yml never runs on it. Without this step the
      # bot's pull request would arrive with no checks at all, and the reviewer
      # would have nothing to go on but the diff.
      - name: Run tests
        id: tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Prepare pull request
        id: prep
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ "$KIND" = paper ]; then
            dir=papers
            checks='- [ ] `area` describes the paper'"'"'s **contribution**, not the topic it discusses.
          - [ ] `scale` reflects the scale of the system studied.
          - [ ] It is not a duplicate of a paper already filed under a different title.'
          else
            dir=resources
            checks='- [ ] The material is not a paper. A paper goes through *Add a Paper*.
          - [ ] `kind` is the section of the Resources page the material belongs in.
          - [ ] `description` states what the resource contains, with no judgment of its quality.
          - [ ] `authors` or `org`, and `year`, are added when known. The form does not ask for them.
          - [ ] It is not a duplicate of a resource already listed under a different name.'
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          cat > pr_body.md <<EOF
          Closes #${ISSUE}

          Generated automatically from the issue. The pull request holds only the new record; README.md and the badge count are regenerated on main by docs_sync.yml after the merge.

          **Already verified** before this pull request was opened: the issue parser accepted the submission, \`npm run build\` succeeded with the new record in place, and \`npm test\` passed.

          GitHub does not run \`on: pull_request\` workflows for pull requests opened by a bot, so those checks ran in the [intake job](../actions/workflows/issue_ops.yml) instead of here.

          This pull request is **not** approved or merged automatically. Before merging, check by hand:
          ${checks}
          EOF

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: src/content/${{ steps.prep.outputs.dir }}/*.yml
          commit-message: "Add new ${{ env.KIND }} from issue #${{ github.event.issue.number }}"
          title: "Add ${{ env.KIND }}: ${{ github.event.issue.title }}"
          body-path: pr_body.md
          branch: "add-${{ env.KIND }}-${{ github.event.issue.number }}"
          labels: ${{ env.KIND }}

      - name: Comment success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
          "Done — the record was generated, the site builds and the tests pass. The pull request is ${PR_URL}, waiting for a maintainer to review and merge it. Thanks for adding the ${KIND}."

      # The reason for the failure has to reach whoever opened the issue, not
      # the log. process_issue.py already writes actionable messages ("Valid
      # values: ..."), so we paste them through verbatim.
      - name: Comment failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=$(cat process.log build.log test.log 2>/dev/null | tail -30)
          gh label create needs-fix --color D93F0B --description "Automatic intake failed; the issue needs correcting" --force || true
          gh issue edit "${{ github.event.issue.number }}" --add-label needs-fix || true
          gh issue comment "${{ github.event.issue.number }}" --body "$(cat <<EOF
          I could not generate the record automatically. The reason:

          \`\`\`
          ${LOG}
          \`\`\`

          Edit the issue with the fix, then close and reopen it — that runs the intake again. If the error mentions the taxonomy, the full list of valid values is at [\`/taxonomy\`](https://juliodosreis.github.io/awesome-agenticsystems/taxonomy).
          EOF
          )"
