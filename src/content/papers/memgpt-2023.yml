tldr: "Introduces a virtual memory hierarchy that allows LLMs to explicitly page information between their limited context window and external storage using function calls."
notes: "Frames the LLM context window as RAM and external databases as disk storage. Crucially, the agent actively manages its own memory through self-directed pagination, moving beyond passive RAG mechanisms for long-running processes."
