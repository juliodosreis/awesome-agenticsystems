# The dropdown options below are generated from src/data/taxonomy.yml by
# scripts/gen_docs.py. Do not edit them by hand: edit the taxonomy and run
# `npm run docs`. CI fails when they are out of sync. A form offering an option
# the validator rejects collects a submission the schema then refuses.
name: Add a Paper
description: Suggest a paper for the collection. Takes about a minute.
title: "[Paper]: "
labels: ["paper"]
body:
  - type: markdown
    attributes:
      value: |
        Submitting this issue opens a pull request automatically. It requires no clone and no local setup.

        The pull request is reviewed before it is merged. A suggestion with a debatable area still records a paper that would otherwise be missing.

  - type: input
    id: paper_link
    attributes:
      label: Link to the paper
      description: arXiv, OpenReview, ACL Anthology, or a publisher page.
      placeholder: https://arxiv.org/abs/2210.03629
    validations:
      required: true

  - type: textarea
    id: bibtex
    attributes:
      label: BibTeX (optional)
      description: >-
        Leave this empty for an arXiv link. The title, authors and year are
        fetched automatically. This field is needed when the link is not arXiv;
        most publisher pages have a "Cite" or "Export citation" button that
        produces a BibTeX entry to paste here.
      placeholder: |
        @inproceedings{...
        }
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### Classification

        Three fields. When the choice is unclear, pick the closest option; a reviewer corrects it before the merge.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: >-
        The main contribution of the paper. The topic it discusses does not
        determine the area. A paper with several agents belongs in
        `coordination` when the coordination mechanism is the contribution;
        otherwise pick the component it improves and mark it `multi-agent`
        below.
      options:
        # gen:issue-areas
        - "foundations — A general view of the field: surveys, taxonomies, position papers."
        - "reasoning-planning — What happens between the input and the action: reasoning, planning, self-critique."
        - memory — What the agent stores and how it retrieves it.
        - tools-context — How the agent acts on the world and where it gets context from.
        - "learning-evolution — Changes that persist between tasks: skills, experience, tuning."
        - architectures — The complete loop of an agent.
        - coordination — The mechanisms by which several agents divide work and communicate.
        - interoperability — Standards through which agents and tools locate and communicate with each other.
        - engineering — The runtime substrate around the model, and how it is operated.
        - evaluation — How an agent or a multi-agent system is measured.
        - safety — Risk, security, trust and control.
        # /gen:issue-areas
    validations:
      required: true

  - type: dropdown
    id: scale
    attributes:
      label: Scale
      description: >-
        The scale of the system studied. `multi-agent` is recorded here, and
        does not place the paper in the `coordination` area. Pick all that
        apply.
      multiple: true
      options:
        # gen:issue-scale
        - single-agent — One agent acting on its own.
        - multi-agent — Several agents in the same system.
        - human-agent — A human is part of the loop.
        # /gen:issue-scale
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: The kind of contribution. Pick all that apply.
      multiple: true
      options:
        # gen:issue-type
        - survey — Reviews an existing body of work.
        - position — Argues for a stance without new experiments.
        - method — Proposes a new technique.
        - benchmark — Introduces a dataset or an evaluation suite.
        - framework — Describes a system end to end rather than one technique.
        - empirical — Measures or compares existing approaches.
        - case-study — Reports one deployment in depth.
        # /gen:issue-type
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Submitting opens a pull request with the paper in the `triaged` state. That state is enough for it to appear on the site, and `tldr`, `notes` and `topics` are filled in later by whoever reads it.

        A rejected submission is reported as a comment on this issue, so the reason is readable without opening the CI logs.
